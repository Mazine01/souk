services:
  - type: web
    name: souk-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build -w server
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SAMESITE
        value: none
